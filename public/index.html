<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>فایل‌های Saved Messages تلگرام</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="header-title">
    <span class="logo-dot"></span>
    <h1>فایل‌های Saved Messages</h1>
  </div>
  <div class="header-actions">
    <span id="status-text" class="status-text">در حال بارگذاری...</span>
    <button id="theme-toggle" class="icon-btn" title="تغییر حالت روز/شب" aria-label="تغییر تم">
      <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20"></svg>
    </button>
  </div>
</header>

<main>

  <!-- بخش ورود -->
  <section id="login-section" class="panel hidden">
    <h2>ورود به تلگرام</h2>
    <p class="muted">برای دریافت فایل‌های Saved Messages ابتدا باید وارد حساب تلگرام خود شوید.</p>

    <div id="connect-step" class="login-step">
      <button id="btn-connect" class="btn primary">اتصال و ارسال کد تایید</button>
    </div>

    <div id="code-step" class="login-step hidden">
      <label for="code-input">کد تایید ارسال‌شده به تلگرام:</label>
      <input id="code-input" type="text" inputmode="numeric" placeholder="مثال: 12345" />
      <button id="btn-submit-code" class="btn primary">تایید کد</button>
    </div>

    <div id="password-step" class="login-step hidden">
      <label for="password-input">رمز دو مرحله‌ای حساب شما:</label>
      <input id="password-input" type="password" placeholder="رمز دو مرحله‌ای" />
      <button id="btn-submit-password" class="btn primary">تایید رمز</button>
    </div>

    <p id="login-error" class="error-text hidden"></p>
  </section>

  <!-- بخش لیست فایل‌ها -->
  <section id="files-section" class="hidden">
    <div id="file-grid" class="file-grid"></div>

    <div class="pager">
      <button id="btn-prev" class="btn" disabled>« قبلی</button>
      <span id="page-indicator" class="muted">صفحه ۱</span>
      <button id="btn-next" class="btn" disabled>بعدی »</button>
      <select id="page-size-select" class="btn page-size-select">
        <option value="50">۵۰ در صفحه</option>
        <option value="100">۱۰۰ در صفحه</option>
        <option value="200">۲۰۰ در صفحه</option>
      </select>
    </div>
  </section>

</main>

<!-- منوی راست‌کلیک / لمس طولانی -->
<div id="context-menu" class="context-menu hidden">
  <button data-action="preview">پیش‌نمایش</button>
  <button data-action="download">دانلود</button>
  <button data-action="delete" class="danger">حذف</button>
</div>

<!-- مودال پیش‌نمایش -->
<div id="preview-modal" class="modal-overlay hidden">
  <div class="modal">
    <button id="modal-close" class="icon-btn modal-close" aria-label="بستن">✕</button>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-footer">
      <span id="modal-filename" class="modal-filename"></span>
      <div class="modal-buttons">
        <button id="modal-download" class="btn primary">دانلود</button>
        <button id="modal-delete" class="btn danger">حذف</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
